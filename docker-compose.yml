services:
  postgres:
    image: postgres:16-alpine
    container_name: file-manager-db
    environment:
      POSTGRES_DB: ${PGDATABASE:-file_manager}
      POSTGRES_USER: ${DB_ADMIN_USER:-fm_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
